services:
  postgres:
    image: postgres:17-alpine
    container_name: medi-postgres
    environment:
      POSTGRES_DB: medi
      POSTGRES_USER: medi
      POSTGRES_PASSWORD: medi
    ports:
      - "5432:5432"
    volumes:
      - medi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medi -d medi"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medi-redis
    ports:
      - "6379:6379"
    volumes:
      - medi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medi_postgres_data:
  medi_redis_data:
