spring:
  datasource:
    url: jdbc:h2:mem:medi_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  mail:
    host: localhost
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: false

management:
  health:
    mail:
      enabled: false

app:
  auth:
    jwt:
      secret: test-jwt-secret-test-jwt-secret-test-jwt-secret
    password-reset:
      mail-mode: log
      mail-from-address: no-reply@test.local
      staff-url: http://localhost:4001/reset-password
      partner-url: http://localhost:4003/reset-password
      user-url: http://localhost:4002/reset-password
