spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:platform}
    password: ${DB_PASSWORD:platform}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:myStrongRedisPassword}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}

app:
  auth:
    jwt:
      secret: ${AUTH_JWT_SECRET:platform-local-development-jwt-secret-change-me-2026}
    session:
      cookie-secure: ${AUTH_COOKIE_SECURE:false}
    password-reset:
      mail-mode: ${PASSWORD_RESET_MAIL_MODE:log}
      mail-from-address: ${MAIL_FROM_ADDRESS:no-reply@platform.local}
      staff-url: ${PASSWORD_RESET_STAFF_URL:http://localhost:4001/password/reset}
      partner-url: ${PASSWORD_RESET_PARTNER_URL:http://localhost:4003/password/reset}
      user-url: ${PASSWORD_RESET_USER_URL:http://localhost:4002/password/reset}
  bootstrap:
    staff:
      enabled: ${STAFF_BOOTSTRAP_ENABLED:true}
      email: ${STAFF_BOOTSTRAP_EMAIL:admin@platform.local}
      password: ${STAFF_BOOTSTRAP_PASSWORD:Platform1234!}
      name: ${STAFF_BOOTSTRAP_NAME:최고 관리자}
      nickname: ${STAFF_BOOTSTRAP_NICKNAME:platform_admin}
      role: ${STAFF_BOOTSTRAP_ROLE:platform.super_admin}
    staff-sample:
      enabled: ${STAFF_SAMPLE_BOOTSTRAP_ENABLED:true}
      email: ${STAFF_SAMPLE_BOOTSTRAP_EMAIL:staff@platform.local}
      password: ${STAFF_SAMPLE_BOOTSTRAP_PASSWORD:Platform1234!}
      name: ${STAFF_SAMPLE_BOOTSTRAP_NAME:일반 직원}
      nickname: ${STAFF_SAMPLE_BOOTSTRAP_NICKNAME:platform_staff}
    partner-sample:
      enabled: ${PARTNER_SAMPLE_BOOTSTRAP_ENABLED:true}
      password: ${PARTNER_SAMPLE_BOOTSTRAP_PASSWORD:Platform1234!}

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
