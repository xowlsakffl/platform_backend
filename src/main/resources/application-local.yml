spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medi}
    username: ${DB_USERNAME:medi}
    password: ${DB_PASSWORD:medi}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
